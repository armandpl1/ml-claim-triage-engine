# Data configuration: sources, paths, targets and data contracts.
# Every threshold the pipeline uses lives here, not in code.

source:
  # French Motor Third-Party Liability (freMTPL2) on OpenML
  policies_openml_id: 41214   # freMTPL2freq: one row per policy
  claims_openml_id: 41215     # freMTPL2sev: one row per claim, with its amount

paths:
  raw_dir: data/raw
  warehouse: data/warehouse.duckdb
  processed_dir: data/processed
  reference_dir: data/reference
  validation_report: data/processed/validation_report.json

seed: 42

targets:
  # Claims above this amount (EUR) are routed to senior adjusters.
  high_cost_threshold: 5000

notes:
  # Synthetic adjuster notes: one per claim, labeled with a category.
  categories: [collision, theft, glass, weather, bodily_injury]
  typo_rate: 0.08   # share of notes with a realistic typo

contracts:
  driver_age: {min: 16, max: 100}
  vehicle_age: {min: 0, max: 100}
  vehicle_power: {min: 1, max: 20}
  bonus_malus: {min: 50, max: 350}
  # Policy years in force. Mostly (0, 1]; the source has a few renewals
  # recorded up to 2.0 years, so the contract allows them.
  exposure: {min: 0.0, max: 2.01}
  claim_amount: {min: 0.01}
  areas: [A, B, C, D, E, F]
  fuel_types: [Regular, Diesel]
  # Target balance: fail if the high-cost share drifts outside this range.
  high_cost_share: {min: 0.02, max: 0.40}
  # Every note category must make up at least this share of claims.
  min_category_share: 0.03
  min_rows: 1000
  # Claims whose policy is missing are dropped; fail if more than this share.
  max_orphan_claim_share: 0.02

split:
  train: 0.70
  validation: 0.15
  test: 0.15

# Grouped and stratified: all claims of a policy stay in one split (so the
# model is never graded on a policy it trained on), and every split keeps the
# same high-cost rate.
split_group: policy_id
split_stratify: is_high_cost

features:
  numeric: [exposure, vehicle_power, vehicle_age, driver_age, bonus_malus, log_density]
  categorical: [area, vehicle_brand, fuel_type, region]
  text: adjuster_note
  target_classification: is_high_cost
  target_regression: claim_amount
  target_text: claim_category
  # Columns that must never be features, and why:
  excluded:
    claim_seq: ranks a policy's claims by amount, so it encodes the target
    claim_count: counts the policy's claims over the whole period, including
      later ones, so it isn't known when a claim arrives
    claim_amount: the regression target; is_high_cost is derived from it
    density: replaced by log_density (heavily skewed, 1 to 27,000)

text:
  # Pinned to an exact Hugging Face commit, so the tokenizer can't change
  # under the model.
  tokenizer: distilbert/distilbert-base-uncased
  revision: 12040accade4e8a0f71eabdb258fecc2e7e948be
  max_length: 48
