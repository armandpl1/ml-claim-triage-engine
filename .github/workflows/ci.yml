# CI: lint and types, the three-tier test suite, and a Docker build check.
#
#   lint (ruff, mypy) ──> test (unit, behavioral, integration) ──> docker (build + smoke)
#   lint ──> helm (lint, render and scan the Kubernetes chart; not a required check)
#   lint ──> storage (Terraform on an AWS emulator, then the MLflow server on
#            Postgres + S3; not a required check)
#
# Runs on every pull request and every push to main. Retraining and the
# champion/challenger gate run in cd-model-gate.yml.
#
# Security: actions pinned to full commit SHAs (version in the comment;
# Dependabot keeps both current), read-only token, no persisted credentials.

name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

env:
  UV_VERSION: "0.13.7"
  UV_LOCKED: "1"
  FORCE_COLOR: "1"

jobs:
  lint:
    name: Lint and type check
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Install dependencies
        run: uv sync

      - name: Check uv.lock matches pyproject.toml
        run: uv lock --check

      - name: Check the drift detector's own lockfile and that it runs
        # Separate pinned env (Evidently needs pandas < 3). With no inference
        # log it must exit 2, "too few requests"; anything else is a failure.
        run: |
          uv lock --script monitoring/drift_detector.py --check
          status=0
          uv run --script monitoring/drift_detector.py || status=$?
          test "$status" -eq 2

      - name: Run pre-commit hooks (ruff lint and format, mypy, file hygiene)
        run: uv run pre-commit run --all-files --show-diff-on-failure

  test:
    name: Tests
    needs: lint
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Install dependencies
        run: uv sync

      - name: Run pytest (unit, behavioral and integration tiers)
        run: uv run pytest --junitxml=reports/pytest.xml

      - name: Upload test report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: pytest-report
          path: reports/pytest.xml
          retention-days: 14

  docker:
    name: Docker build
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Build the serving image
        run: docker build --tag claim-triage-api:ci .

      - name: Smoke test (the slim image can import the API)
        run: docker run --rm claim-triage-api:ci python -c "import src.serving.app; print('ok')"

      - name: Image size
        run: docker image ls claim-triage-api:ci

      # Report only: a new CVE in the base image shouldn't fail unrelated PRs.
      # The release workflow (release.yml) refuses to publish with one.
      - name: Vulnerability report (Trivy, fixable HIGH and CRITICAL)
        run: |
          docker run --rm -v /var/run/docker.sock:/var/run/docker.sock aquasec/trivy:0.67.2 \
            image --quiet --scanners vuln --severity HIGH,CRITICAL --ignore-unfixed \
            --exit-code 0 claim-triage-api:ci

  # infra/terraform applied to Moto (an AWS emulator, no account), checked,
  # then the MLflow server on Postgres + S3 smoke-tested end to end.
  storage:
    name: Storage (Terraform + MLflow on an AWS emulator)
    needs: lint
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Terraform
        uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: 1.15.6
          terraform_wrapper: false

      - name: Install uv
        uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Install dependencies
        run: uv sync

      - name: Format and validate
        run: |
          terraform -chdir=infra/terraform fmt -check -recursive
          terraform -chdir=infra/terraform init -input=false
          terraform -chdir=infra/terraform validate

      - name: Security scan (Trivy, fails on any finding)
        run: |
          docker run --rm -v "$PWD/infra/terraform:/src" aquasec/trivy:0.67.2 \
            config --quiet --exit-code 1 /src

      - name: Apply to the emulator; a second plan must show no changes
        run: make infra-up

      - name: Check the buckets and roles are safe
        run: make infra-check

      - name: Start MLflow on Postgres + S3 and smoke-test it
        run: |
          make mlflow-up
          make mlflow-check

      - name: Save the emulator and MLflow logs
        if: ${{ failure() }}
        run: docker compose -f infra/docker-compose.yml --profile mlflow logs > storage-logs.txt

      - name: Upload the logs
        if: ${{ failure() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: storage-logs
          path: storage-logs.txt
          retention-days: 14

  helm:
    name: Helm chart (lint, render, security scan)
    needs: lint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Helm
        uses: azure/setup-helm@1a275c3b69536ee54be43f2070a358922e12c8d4 # v4.3.1
        with:
          version: v3.18.3

      - name: Lint
        run: helm lint --strict infra/k8s/chart

      - name: Render the stable release (with a canary route) and the canary
        run: |
          mkdir -p rendered
          helm template claim-triage-api infra/k8s/chart --set image.tag=ci \
            --set route.enabled=true --set route.canaryWeight=10 > rendered/stable.yaml
          helm template claim-triage-api-canary infra/k8s/chart --set image.tag=ci \
            --values infra/k8s/canary-values.yaml > rendered/canary.yaml

      - name: Security scan (Trivy; deliberate exceptions in infra/k8s/trivyignore.yaml)
        run: |
          docker run --rm -v "$PWD/infra/k8s:/src" aquasec/trivy:0.67.2 \
            config --quiet --exit-code 1 --ignorefile /src/trivyignore.yaml /src

      - name: Upload the rendered manifests
        if: ${{ failure() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: helm-rendered
          path: rendered/
          retention-days: 14
