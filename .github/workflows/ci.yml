# CI: lint and types, the three-tier test suite, and a Docker build check.
#
#   lint (ruff, mypy) ──> test (unit, behavioral, integration) ──> docker (build + smoke)
#
# Runs on every pull request and every push to main. Retraining and the
# champion/challenger gate run in cd-model-gate.yml.
#
# Security: actions pinned to full commit SHAs (version in the comment;
# Dependabot keeps both current), read-only token, no persisted credentials.

name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

env:
  UV_VERSION: "0.13.7"
  UV_LOCKED: "1"
  FORCE_COLOR: "1"

jobs:
  lint:
    name: Lint and type check
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Install dependencies
        run: uv sync

      - name: Check uv.lock matches pyproject.toml
        run: uv lock --check

      - name: Check the drift detector's own lockfile and that it runs
        # Separate pinned env (Evidently needs pandas < 3). With no inference
        # log it must exit 2, "too few requests"; anything else is a failure.
        run: |
          uv lock --script monitoring/drift_detector.py --check
          status=0
          uv run --script monitoring/drift_detector.py || status=$?
          test "$status" -eq 2

      - name: Run pre-commit hooks (ruff lint and format, mypy, file hygiene)
        run: uv run pre-commit run --all-files --show-diff-on-failure

  test:
    name: Tests
    needs: lint
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Install dependencies
        run: uv sync

      - name: Run pytest (unit, behavioral and integration tiers)
        run: uv run pytest --junitxml=reports/pytest.xml

      - name: Upload test report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: pytest-report
          path: reports/pytest.xml
          retention-days: 14

  docker:
    name: Docker build
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Build the serving image
        run: docker build --tag claim-triage-api:ci .

      - name: Smoke test (the slim image can import the API)
        run: docker run --rm claim-triage-api:ci python -c "import src.serving.app; print('ok')"

      - name: Image size
        run: docker image ls claim-triage-api:ci
