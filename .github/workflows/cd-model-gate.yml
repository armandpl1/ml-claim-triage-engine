# Retraining and anti-regression gate.
#
# Weekly, or on demand: rebuild the data from source, retrain the tabular
# model, and run the champion/challenger gate on the untouched test split.
#
# This workflow uses a fresh, temporary MLflow registry, so there is no
# champion and the gate runs its first-model checks: beat a naive baseline
# and meet the latency budget. Point MLFLOW_TRACKING_URI at a shared MLflow
# server (a repository secret) to gate against the real champion.
#
# The note classifier is not retrained here: fine-tuning DistilBERT on a
# CPU runner takes too long for CI. Retrain it locally with `make train-nlp`.

name: CD - retrain and gate

on:
  schedule:
    - cron: "0 6 * * 1"   # Mondays 06:00 UTC
  workflow_dispatch:

concurrency:
  group: model-gate
  cancel-in-progress: false

permissions:
  contents: read

env:
  UV_VERSION: "0.13.7"
  UV_LOCKED: "1"
  MLFLOW_DISABLE_AGENT_HINT: "1"

jobs:
  retrain-and-gate:
    name: Retrain tabular model and gate it
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Check out code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Install dependencies
        run: uv sync

      - name: Rebuild data from source (fetch, contracts, features)
        run: uv run dvc repro features

      - name: Use fewer tuning trials on the CI runner
        run: |
          uv run python -c "import yaml; c = yaml.safe_load(open('configs/train_config.yaml')); c['tabular']['n_trials'] = 8; yaml.safe_dump(c, open('ci_train_config.yaml', 'w'))"
          echo "CLAIM_TRIAGE_TRAIN_CONFIG=$PWD/ci_train_config.yaml" >> "$GITHUB_ENV"

      - name: Retrain the tabular model
        run: uv run python -m src.training.tabular

      - name: Champion/challenger gate
        run: uv run python -m src.evaluation.gate --model tabular

      - name: Upload model, metrics and gate report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: retrain-gate-report
          path: |
            artifacts/tabular/
            artifacts/gate/
            data/processed/validation_report.json
            data/processed/feature_report.json
          retention-days: 30
