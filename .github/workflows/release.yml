# Release: runs when a version tag (vX.Y.Z) is pushed.
#
#   tag == pyproject version ──> build ──> smoke test ──> Trivy scan ──> push to GHCR
#
# The image is pushed only if the scan finds no fixable HIGH or CRITICAL
# vulnerability. Tags: X.Y.Z, X.Y, and sha-<commit>. No `latest`: each
# environment names the exact version it runs (infra/k8s/environments/).
# Images hold code only; models come from the registry or a bundle.
#
# Security: plain docker CLI (no third-party actions besides checkout), the
# built-in GITHUB_TOKEN, and only this job gets `packages: write`. The tag is
# read from GITHUB_REF_NAME in the shell, never pasted into a script.

name: Release

on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  image:
    name: Build, scan and publish the API image
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    env:
      IMAGE: ghcr.io/${{ github.repository_owner }}/claim-triage-api
    steps:
      - name: Check out code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Check the tag matches the project version
        run: |
          version="$(grep -m1 '^version = ' pyproject.toml | cut -d'"' -f2)"
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "::error::tag $GITHUB_REF_NAME, but pyproject.toml says $version"
            exit 1
          fi
          echo "VERSION=$version" >> "$GITHUB_ENV"

      - name: Build
        run: |
          docker build \
            --build-arg "APP_VERSION=$VERSION" \
            --label "org.opencontainers.image.source=https://github.com/$GITHUB_REPOSITORY" \
            --label "org.opencontainers.image.version=$VERSION" \
            --label "org.opencontainers.image.revision=$GITHUB_SHA" \
            --label "org.opencontainers.image.description=Claim triage API (FastAPI + ONNX Runtime)" \
            --tag "$IMAGE:$VERSION" .

      - name: Smoke test (imports the API, reports its version)
        run: |
          docker run --rm "$IMAGE:$VERSION" python -c \
            "import os, src.serving.app as a; assert a.APP_VERSION == os.environ['APP_VERSION']; print(a.APP_VERSION)"

      - name: Scan (Trivy; fails on any fixable HIGH or CRITICAL vulnerability)
        run: |
          docker run --rm -v /var/run/docker.sock:/var/run/docker.sock aquasec/trivy:0.67.2 \
            image --quiet --scanners vuln --severity HIGH,CRITICAL --ignore-unfixed \
            --exit-code 1 "$IMAGE:$VERSION"

      - name: Push to GHCR
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "$GITHUB_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          minor="${VERSION%.*}"
          for tag in "$VERSION" "$minor" "sha-${GITHUB_SHA::7}"; do
            docker tag "$IMAGE:$VERSION" "$IMAGE:$tag"
            docker push --quiet "$IMAGE:$tag"
          done
          digest="$(docker inspect --format '{{index .RepoDigests 0}}' "$IMAGE:$VERSION")"
          {
            echo "### Released $IMAGE:$VERSION"
            echo "Tags: \`$VERSION\`, \`$minor\`, \`sha-${GITHUB_SHA::7}\`"
            echo "Digest: \`$digest\`"
          } >> "$GITHUB_STEP_SUMMARY"
          docker logout ghcr.io
