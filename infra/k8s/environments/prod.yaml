# prod: a released image and the @prod models (make promote ENV=prod, which
# only takes what staging ran). Autoscaled 2-4 pods, disruption budget,
# canary releases. The gateway's default route (localhost:8090), and
# localhost:8080 straight to the service.
#
# To release a new image to prod, change `tag` in a pull request, after the
# same tag has run in staging.
image:
  repository: ghcr.io/armandpl1/claim-triage-api
  tag: "1.0.0"
  pullPolicy: IfNotPresent
service:
  type: NodePort
  nodePort: 30080
route:
  enabled: true
  hostnames: []              # any host: the default route
models:
  bundlePath: /mnt/claim-triage/repo/serving_bundle_prod
