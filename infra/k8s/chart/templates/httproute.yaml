{{- /*
Weighted route through the Gateway (Traefik, make k8s-up). Owned by the
stable release; during a canary it sends canaryWeight percent of requests to
the canary release's service. The split is per request, unlike a Service,
which balances connections.
*/ -}}
{{- if .Values.route.enabled }}
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: {{ include "api.name" . }}
  labels: {{- include "api.labels" . | nindent 4 }}
spec:
  parentRefs:
    - name: {{ .Values.route.gateway.name }}
      namespace: {{ .Values.route.gateway.namespace }}
  rules:
    - backendRefs:
        - name: {{ include "api.name" . }}-stable
          port: {{ .Values.service.port }}
          weight: {{ sub 100 (int .Values.route.canaryWeight) }}
        {{- if gt (int .Values.route.canaryWeight) 0 }}
        - name: {{ include "api.name" . }}-canary
          port: {{ .Values.service.port }}
          weight: {{ .Values.route.canaryWeight }}
        {{- end }}
{{- end }}
