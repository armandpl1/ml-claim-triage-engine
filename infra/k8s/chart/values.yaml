# Claim triage API. One release per track: `stable` (the champion) and,
# during a release, `canary` (the challenger), from the same chart.

track: stable
# Which environment this release is (dev, staging, prod), reported by /health
environment: ""

image:
  repository: claim-triage-api
  # make k8s-deploy sets the git commit; empty falls back to appVersion.
  tag: ""
  # Images are loaded into kind with `kind load docker-image`, never pulled.
  pullPolicy: Never

# Used only when autoscaling is off (the canary runs one fixed pod).
replicaCount: 2

# CPU-based autoscaling (needs metrics-server: make k8s-up). Idle pods use
# 6-12m CPU; 70% of the 250m request is 175m, so only real load scales.
autoscaling:
  enabled: true
  minReplicas: 2
  maxReplicas: 4          # 4 x 512Mi limit = 2 GB: the laptop's budget
  targetCPUUtilizationPercentage: 70
  # Scale up at once; scale down after 2 minutes of low load (default is 5),
  # so a load test shows the whole cycle without flapping.
  scaleDownStabilizationSeconds: 120

# Keep at least one pod serving through voluntary disruptions (node drain,
# cluster upgrade). Rolling updates already keep every replica (maxUnavailable 0).
podDisruptionBudget:
  enabled: true
  minAvailable: 1

# Model files and the online feature store, on the kind node (extraMounts in
# infra/k8s/kind-config.yaml.tmpl), mounted read-only into every pod.
models:
  bundlePath: /mnt/claim-triage/repo/serving_bundle
  # A hash of the bundle's metadata.json, set by make deploy. Stored as a pod
  # annotation, so new models restart the pods (otherwise the spec is
  # unchanged and the pods keep the old models in memory).
  revision: ""
featureStore:
  path: /mnt/claim-triage/repo/data/feature_store

# ONNX Runtime threads per pod. 1 so that scaling adds pods, not threads
# fighting over the same cores.
ortThreads: 1

# Requests from measured pods: 183 MB with both models after 50 requests,
# plus about 45 MB for the online feature store held in memory.
# No CPU limit: a limit throttles latency spikes; the request is what the
# scheduler and the autoscaler use.
resources:
  requests:
    cpu: 250m
    memory: 320Mi
  limits:
    memory: 512Mi

# Route through the Gateway (host port 8090), stable release only. During a
# canary release, canaryWeight percent of requests go to the canary.
route:
  enabled: false
  # Hostnames this route answers; empty means any host (prod's default route).
  hostnames: []
  gateway: {name: traefik-gateway, namespace: traefik}
  canaryWeight: 0

service:
  type: NodePort
  port: 8000
  nodePort: 30080   # host port 8080 (kind extraPortMappings)

probes:
  # Startup: models load before the first request (a few seconds).
  startup: {periodSeconds: 2, failureThreshold: 30, timeoutSeconds: 2}
  # Kubernetes' default timeout is 1 s. A busy pod is slow, not dead: give
  # readiness 2 s, and restart only after 30 s of failed liveness checks.
  readiness: {periodSeconds: 5, failureThreshold: 2, timeoutSeconds: 2}
  liveness: {periodSeconds: 10, failureThreshold: 3, timeoutSeconds: 3}

# On scale-down or rollout, wait before SIGTERM so the pod leaves the
# Service's endpoints first; uvicorn then finishes in-flight requests.
preStopSleepSeconds: 5
terminationGracePeriodSeconds: 30
