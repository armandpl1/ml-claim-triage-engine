[project]
name = "ml-claim-triage-engine"
version = "0.1.0"
description = "Insurance claim triage: claim cost and severity models plus an NLP note classifier, served with FastAPI and monitored for drift."
readme = "README.md"
requires-python = ">=3.11,<3.13"
# Shared by every part of the project, including the slim serving image.
dependencies = [
    "data-ml-toolkit",
    "numpy>=1.26",
    "pyyaml>=6.0",
]

# Each group is one part of the system. `uv sync` installs all of them
# locally; the Docker image installs only `serve`.
[dependency-groups]
# Ingestion, contracts and features (Steps 2-3)
pipeline = [
    "duckdb>=1.1",
    "pandas>=2.2",
    "pandera>=0.20",
    "pyarrow>=17",
    "scikit-learn>=1.5",
]
# The API (Step 7): inference only, no training libraries
serve = [
    "fastapi>=0.115",
    "mlflow-skinny>=2.17",
    "onnxruntime>=1.20",
    "prometheus-client>=0.21",
    "pydantic>=2.9",
    "tokenizers>=0.20",
    "uvicorn>=0.32",
]
dev = [
    "boto3>=1.43.117",
    # ruff, mypy, pytest and pre-commit at the versions pinned by the toolkit
    "data-ml-toolkit[dev]",
    "dvc>=3.50",
    "dvc-s3>=3.3.0",
    "httpx>=0.27",
    "moto[iam,kms,s3,sts]>=5.2.6",
    "pandas-stubs>=2.2",
    "types-pyyaml>=6.0",
]
# Training, tuning, fine-tuning and export (Step 4)
train = [
    "joblib>=1.4",
    "lightgbm>=4.5",
    "matplotlib>=3.9",
    "mlflow>=2.17",
    "onnx>=1.17",
    "onnxmltools>=1.12",
    "onnxruntime>=1.20",
    "optuna>=4.0",
    "peft>=0.13",
    "skl2onnx>=1.17",
    "torch>=2.5",
    "transformers>=4.46",
]
orchestrate = [
    "dagster>=1.13.31",
    "dagster-webserver>=1.13.31",
]

[tool.uv]
package = false
default-groups = ["pipeline", "train", "serve", "dev", "orchestrate"]

# CPU-only PyTorch: skips ~2 GB of CUDA libraries a laptop CPU can't use.
[tool.uv.sources]
torch = [{ index = "pytorch-cpu" }]
# Shared SDK and dev tool pins: https://github.com/armandpl1/data-ml-toolkit
data-ml-toolkit = { git = "https://github.com/armandpl1/data-ml-toolkit", tag = "v0.1.0" }

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
warn_unused_ignores = true
warn_redundant_casts = true
check_untyped_defs = true
exclude = ["^tests/"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
markers = [
    "integration: end-to-end pipeline tests on a small fixture",
    "behavioral: invariance and directional-expectation model tests",
]
