[project]
name = "ml-claim-triage-engine"
version = "0.1.0"
description = "Insurance claim triage: claim cost and severity models plus an NLP note classifier, served with FastAPI and monitored for drift."
readme = "README.md"
requires-python = ">=3.11,<3.13"
dependencies = [
    "duckdb>=1.1",
    "numpy>=1.26",
    "pandas>=2.2",
    "pandera>=0.20",
    "pyarrow>=17",
    "pyyaml>=6.0",
    "scikit-learn>=1.5",
]

[dependency-groups]
dev = [
    "dvc>=3.50",
    "mypy>=1.11",
    "pandas-stubs>=2.2",
    "pre-commit>=3.8",
    "pytest>=8.3",
    "ruff>=0.6",
    "types-pyyaml>=6.0",
]
# Training and NLP stack (Steps 3-4). Installed by default with `uv sync`;
# the serving image (Step 7) installs only what inference needs.
train = [
    "joblib>=1.4",
    "lightgbm>=4.5",
    "matplotlib>=3.9",
    "mlflow>=2.17",
    "onnx>=1.17",
    "onnxmltools>=1.12",
    "onnxruntime>=1.20",
    "optuna>=4.0",
    "peft>=0.13",
    "skl2onnx>=1.17",
    "torch>=2.5",
    "transformers>=4.46",
]

[tool.uv]
package = false
default-groups = ["dev", "train"]

# CPU-only PyTorch: skips ~2 GB of CUDA libraries a laptop CPU can't use.
[tool.uv.sources]
torch = [{ index = "pytorch-cpu" }]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
warn_unused_ignores = true
warn_redundant_casts = true
check_untyped_defs = true
exclude = ["^tests/"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
markers = [
    "integration: end-to-end pipeline tests on a small fixture",
    "behavioral: invariance and directional-expectation model tests",
]
